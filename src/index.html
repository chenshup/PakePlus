<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在启动...</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000; /* 备用背景色 */
        }

        #splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url("./splash.png") no-repeat center center;
            background-size: cover;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #loading-text {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            color: #fff;
            font-family: Arial, sans-serif;
            font-size: 16px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div id="splash">
        <div id="loading-text">正在进入，请稍候...</div>
    </div>

    <script>
        // 延迟加载真实页面（修改为你的网站地址）
        const targetUrl = "https://ly697.vip";

        setTimeout(() => {
            // 淡出封面
            document.getElementById("splash").style.opacity = 0;

            // 再延迟一点让动画完成后跳转
            setTimeout(() => {
                location.href = targetUrl;
            }, 800);
        }, 2500); // 停留时间（毫秒）
    </script>
</body>
</html>
